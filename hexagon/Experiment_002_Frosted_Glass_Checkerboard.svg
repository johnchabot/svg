<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<style>
.face{fill:#f4f6f8;fill-opacity:.22;stroke:#5b6168;stroke-width:1.2;stroke-linejoin:round}
.rear{fill:#f4f6f8;fill-opacity:.12;stroke:#7a8088;stroke-opacity:.45}
</style>

<defs>
<pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
  <rect width="48" height="48" fill="#d9d9d9"/>
  <rect width="24" height="24" fill="#efefef"/>
  <rect x="24" y="24" width="24" height="24" fill="#efefef"/>
</pattern>

<filter id="soften">
  <feGaussianBlur stdDeviation="0.8"/>
</filter>
</defs>

<!-- Checkerboard -->
<rect width="520" height="360" fill="url(#checker)"/>

<!-- Rear prism -->
<g filter="url(#soften)">
<polygon class="rear" points="170,90 270,90 320,125 270,160 170,160 120,125"/>
<polygon class="rear" points="170,160 270,160 270,275 170,275"/>
<polygon class="rear" points="270,160 320,125 320,240 270,275"/>
</g>

<!-- Front prism -->
<polygon class="face" points="140,60 240,60 290,95 240,130 140,130 90,95"/>
<polygon class="face" points="140,130 240,130 240,245 140,245"/>
<polygon class="face" points="240,130 290,95 290,210 240,245"/>

<!-- Crisp front edges -->
<line x1="140" y1="130" x2="240" y2="130" stroke="#ffffff" stroke-opacity=".35"/>
<line x1="240" y1="130" x2="290" y2="95" stroke="#ffffff" stroke-opacity=".35"/>

</svg>
