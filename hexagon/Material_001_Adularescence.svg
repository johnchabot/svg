<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="385" height="315" viewBox="0 0 385 315">

<defs>

  <!-- Soft checker background -->
  <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#d8d8d8"/>
    <rect width="12" height="12" fill="#eeeeee"/>
    <rect x="12" y="12" width="12" height="12" fill="#eeeeee"/>
  </pattern>

  <!-- Gentle coloured glass -->
  <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#b8dcff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#3f8fff" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="glassCyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d7ffff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#43dfe8" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="glassViolet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#efe6ff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#8b73ff" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="glassPink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffe4f3" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ff83bf" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="glassAmber" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fff3d5" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffb24f" stop-opacity="0.35"/>
  </linearGradient>

  <linearGradient id="glassPale" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7f8ff" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#d7dcff" stop-opacity="0.30"/>
  </linearGradient>

  <!-- First adularescence experiment -->
  <linearGradient id="adularescence" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="34%" stop-color="#dff3ff" stop-opacity="0.10"/>
    <stop offset="48%" stop-color="#ffffff" stop-opacity="0.30"/>
    <stop offset="62%" stop-color="#bfe8ff" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

</defs>

<rect width="100%" height="100%" fill="url(#checker)"/>

<!-- back -->
<g opacity="1">
<polygon points="28,220 142,156 298,156 378,224 274,310 74,306"
 fill="url(#glassPale)"/>
<polygon points="4,58 50,122 74,306 28,220"
 fill="url(#glassPink)"/>
<polygon points="50,122 264,122 274,310 74,306"
 fill="url(#glassCyan)"/>
<polygon points="264,122 378,52 378,224 274,310"
 fill="url(#glassAmber)"/>
</g>

<!-- front -->
<polygon points="4,58 126,6 142,156 28,220"
 fill="url(#glassBlue)"/>
<polygon points="126,6 292,4 298,156 142,156"
 fill="url(#glassCyan)"/>
<polygon points="292,4 378,52 378,224 298,156"
 fill="url(#glassViolet)"/>
<polygon points="4,58 126,6 292,4 378,52 264,122 50,122"
 fill="url(#glassBlue)"/>

<!-- Shared adularescence pass -->
<polygon
 points="4,58 126,6 292,4 378,52 378,224 274,310 74,306 28,220"
 fill="url(#adularescence)"/>

<!-- Wireframe -->
<g fill="none" stroke="#111" stroke-width="1">
<polygon points="4,58 126,6 292,4 378,52 378,224 274,310 74,306 28,220"/>
<polyline points="126,6 142,156 298,156"/>
<polyline points="50,122 264,122"/>
<line x1="28" y1="220" x2="142" y2="156"/>
<line x1="298" y1="156" x2="378" y2="224"/>
<line x1="74" y1="306" x2="274" y2="310"/>
</g>

</svg>
