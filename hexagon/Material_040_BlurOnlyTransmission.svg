<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<defs>
  <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="20" height="20" fill="#d8d8d8"/>
    <rect width="10" height="10" fill="#efefef"/>
    <rect x="10" y="10" width="10" height="10" fill="#efefef"/>
  </pattern>

  <filter id="blur12" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

  <clipPath id="hex">
    <polygon points="120,40 240,40 310,100 310,240 240,300 120,300 50,240 50,100"/>
  </clipPath>

  <style>
    text{font:16px Arial;fill:#222}
    .edge{fill:none;stroke:#5d7189;stroke-opacity:.35;stroke-width:2}
  </style>
</defs>

<rect width="900" height="360" fill="url(#checker)"/>

<text x="90" y="22">A. Original checkerboard</text>

<g transform="translate(20,20)">
  <g clip-path="url(#hex)">
    <rect x="-120" y="-120" width="600" height="600" fill="url(#checker)"/>
  </g>
  <polygon class="edge"
    points="120,40 240,40 310,100 310,240 240,300 120,300 50,240 50,100"/>
</g>

<text x="490" y="22">B. Blurred checkerboard only</text>

<g transform="translate(440,20)">
  <g clip-path="url(#hex)">
    <rect x="-120" y="-120" width="600" height="600"
          fill="url(#checker)"
          filter="url(#blur12)"/>
  </g>
  <polygon class="edge"
    points="120,40 240,40 310,100 310,240 240,300 120,300 50,240 50,100"/>
</g>

</svg>
