<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
<style>
svg{background:#fff}
.hex{fill:none;stroke:#fff;stroke-width:2}
.facet{stroke:#fff;stroke-width:2;stroke-linejoin:round}
.tower-a .facet{fill:#5b8cff;fill-opacity:.42}
.tower-b .facet{fill:#8f66ff;fill-opacity:.42}
.tower-c .facet{fill:#58cf8d;fill-opacity:.42}
.tower-d .facet{fill:#f2b24d;fill-opacity:.42}
</style>
<defs>
<polygon id="hexagon" points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19"/>
</defs>

<!-- Shared neighbourhood: slight overlap, rotated away from common centre -->
<g id="shared-neighbourhood">

<g id="tower-a" class="tower-a" transform="translate(420,560) rotate(-6)">
 <polygon class="facet" points="-33,-19 0,-38 -8,-168 -42,-147"/>
 <polygon class="facet" points="0,-38 33,-19 28,-150 -8,-168"/>
 <polygon class="facet" points="33,-19 33,19 31,-110 28,-150"/>
