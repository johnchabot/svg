 <polygon class="facet" points="0,38 -33,19 -39,-92 -3,-74"/>
 <polygon class="facet" points="-33,19 -33,-19 -42,-147 -39,-92"/>
 <use href="#hexagon" class="hex"/>
 <use href="#hexagon" class="hex" transform="translate(-8,-128) rotate(4) scale(1.08)"/>
</g>

