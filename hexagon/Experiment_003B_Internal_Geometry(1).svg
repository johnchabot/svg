<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<defs>
<pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
  <rect width="48" height="48" fill="#d9d9d9"/>
  <rect width="24" height="24" fill="#efefef"/>
  <rect x="24" y="24" width="24" height="24" fill="#efefef"/>
</pattern>
<linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
  <stop offset="100%" stop-color="#d9e5f0" stop-opacity=".10"/>
</linearGradient>
</defs>

<rect width="520" height="360" fill="url(#checker)"/>

<!-- Hidden geometry of SAME prism -->
<g stroke="#707780" stroke-width="0.9" stroke-opacity=".28" fill="none">
  <!-- rear top -->
  <polygon points="160,85 260,85 310,120 260,155 160,155 110,120"/>
  <!-- hidden verticals -->
  <line x1="160" y1="155" x2="160" y2="270"/>
  <line x1="260" y1="155" x2="260" y2="270"/>
  <line x1="110" y1="120" x2="110" y2="235"/>
  <line x1="310" y1="120" x2="310" y2="235"/>
  <!-- rear bottom visible edges -->
  <polyline points="110,235 160,270 260,270 310,235"/>
</g>

<!-- Front faces -->
<g stroke="#505760" stroke-width="1.2">
  <polygon fill="url(#glass)" points="140,60 240,60 290,95 240,130 140,130 90,95"/>
  <polygon fill="url(#glass)" points="90,95 140,130 140,245 90,210"/>
  <polygon fill="url(#glass)" points="140,130 240,130 240,245 140,245"/>
  <polygon fill="url(#glass)" points="240,130 290,95 290,210 240,245"/>

  <line x1="140" y1="130" x2="240" y2="130" stroke="white" stroke-opacity=".25"/>
  <line x1="240" y1="130" x2="290" y2="95" stroke="white" stroke-opacity=".22"/>
</g>
</svg>
