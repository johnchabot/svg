<svg viewBox="0 0 600 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background: #fdfdfd;">
  <!-- Definitions for a standard regular hexagon and center point -->
  <!-- Added an explicit 90-degree right rotation to the base definition -->
  <defs>
    <polygon id="hexagon" points="100,0 50,86.603 -50,86.603 -100,0 -50,-86.603 50,-86.603" transform="rotate(90)" stroke-width="2.5" opacity="0.65"/>
    <circle id="center-dot" cx="0" cy="0" r="4" fill="#222222"/>
  </defs>

  <!-- Visual guide showing the rotated diamond shape formed by the center points -->
  <g fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4">
    <polygon points="300,275 225,200 300,125 375,200" />
  </g>

  <!-- 1. South Vertex: Blue Hexagon (Originally 0°, now pointing straight down) -->
  <g transform="translate(300, 275)">
    <use href="#hexagon" fill="#caf0f8" stroke="#00b4d8" />
    <use href="#center-dot" />
    <text x="0" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0077b6">0° (Rotated 90° R)</text>
  </g>

  <!-- 2. West Vertex: Red Hexagon (Originally 45°) -->
  <g transform="translate(225, 200)">
    <use href="#hexagon" transform="rotate(45)" fill="#f8ad9d" stroke="#f4978e" />
    <use href="#center-dot" />
    <text x="-55" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e56b6f">45°</text>
  </g>

  <!-- 3. North Vertex: Green Hexagon (Originally 90°) -->
  <g transform="translate(300, 125)">
    <use href="#hexagon" transform="rotate(90)" fill="#d8f3dc" stroke="#b7e4c7" />
    <use href="#center-dot" />
    <text x="0" y="-115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#52b788">90°</text>
  </g>

  <!-- 4. East Vertex: Purple Hexagon (Originally 135°) -->
  <g transform="translate(375, 200)">
    <use href="#hexagon" transform="rotate(135)" fill="#e1beed" stroke="#c77dff" />
    <use href="#center-dot" />
    <text x="45" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d4edd">135°</text>
  </g>
  
  <!-- Central Label -->
  <text x="300" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#555555" opacity="0.8">Shared Core</text>
</svg>
