<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<defs>
<pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
  <rect width="48" height="48" fill="#d9d9d9"/>
  <rect width="24" height="24" fill="#efefef"/>
  <rect x="24" y="24" width="24" height="24" fill="#efefef"/>
</pattern>
<linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
  <stop offset="100%" stop-color="#dfeaf6" stop-opacity=".08"/>
</linearGradient>
<style>
.outer{stroke:#4f5660;stroke-width:1.2;fill:none}
.inner{stroke:#7f8790;stroke-opacity:.18;stroke-width:1;fill:none}
.sheet{fill:url(#glass);stroke:none}
</style>
</defs>

<rect width="520" height="360" fill="url(#checker)"/>

<!-- Optical sheets first -->

<!-- visible side faces -->
<polygon class="sheet" points="90,95 140,130 140,245 90,210"/>
<polygon class="sheet" points="140,130 240,130 240,245 140,245"/>
<polygon class="sheet" points="240,130 290,95 290,210 240,245"/>

<!-- hidden side faces of SAME prism -->
<polygon class="sheet" opacity=".55"
 points="110,120 160,155 160,270 110,235"/>
<polygon class="sheet" opacity=".55"
 points="160,155 260,155 260,270 160,270"/>
<polygon class="sheet" opacity=".55"
 points="260,155 310,120 310,235 260,270"/>

<!-- top -->
<polygon class="sheet"
 points="140,60 240,60 290,95 240,130 140,130 90,95"/>

<!-- front wireframe -->
<polygon class="outer" points="140,60 240,60 290,95 240,130 140,130 90,95"/>
<polygon class="outer" points="90,95 140,130 140,245 90,210"/>
<polygon class="outer" points="140,130 240,130 240,245 140,245"/>
<polygon class="outer" points="240,130 290,95 290,210 240,245"/>

<!-- ONLY internal edges, not a second outline -->
<g class="inner">
  <line x1="160" y1="155" x2="160" y2="270"/>
  <line x1="260" y1="155" x2="260" y2="270"/>
  <line x1="110" y1="235" x2="160" y2="270"/>
  <line x1="160" y1="270" x2="260" y2="270"/>
  <line x1="260" y1="270" x2="310" y2="235"/>
</g>

</svg>
