<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="385" height="315" viewBox="0 0 385 315">
<defs>

<pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
 <rect width="24" height="24" fill="#d8d8d8"/>
 <rect width="12" height="12" fill="#efefef"/>
 <rect x="12" y="12" width="12" height="12" fill="#efefef"/>
</pattern>

<!-- Glass now owns colour + density + subtle internal variation -->
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#cfe6ff" stop-opacity="0.40"/>
 <stop offset="40%" stop-color="#74b7ff" stop-opacity="0.50"/>
 <stop offset="100%" stop-color="#3f8fff" stop-opacity="0.62"/>
</linearGradient>

<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#dbffff" stop-opacity="0.40"/>
 <stop offset="40%" stop-color="#87f0f4" stop-opacity="0.50"/>
 <stop offset="100%" stop-color="#35d7e8" stop-opacity="0.62"/>
</linearGradient>

<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#eee8ff" stop-opacity="0.40"/>
 <stop offset="40%" stop-color="#baa7ff" stop-opacity="0.50"/>
 <stop offset="100%" stop-color="#8365ff" stop-opacity="0.62"/>
</linearGradient>

<linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#ffe8f4" stop-opacity="0.40"/>
 <stop offset="40%" stop-color="#ffb4d6" stop-opacity="0.50"/>
 <stop offset="100%" stop-color="#ff79b7" stop-opacity="0.60"/>
</linearGradient>

<linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#fff4d8" stop-opacity="0.40"/>
 <stop offset="40%" stop-color="#ffd18a" stop-opacity="0.50"/>
 <stop offset="100%" stop-color="#ffb24b" stop-opacity="0.62"/>
</linearGradient>

<linearGradient id="pale" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#fafbff" stop-opacity="0.32"/>
 <stop offset="100%" stop-color="#d5dcff" stop-opacity="0.50"/>
</linearGradient>

<!-- Material: restrained adularescence only -->
<linearGradient id="adular" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
 <stop offset="43%" stop-color="#d9f1ff" stop-opacity="0.08"/>
 <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
 <stop offset="57%" stop-color="#d9f1ff" stop-opacity="0.08"/>
 <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

</defs>

<rect width="100%" height="100%" fill="url(#checker)"/>

<!-- back -->
<polygon points="28,220 142,156 298,156 378,224 274,310 74,306" fill="url(#pale)"/>
<polygon points="4,58 50,122 74,306 28,220" fill="url(#pink)"/>
<polygon points="50,122 264,122 274,310 74,306" fill="url(#cyan)"/>
<polygon points="264,122 378,52 378,224 274,310" fill="url(#amber)"/>

<!-- front -->
<polygon points="4,58 126,6 142,156 28,220" fill="url(#blue)"/>
<polygon points="126,6 292,4 298,156 142,156" fill="url(#cyan)"/>
<polygon points="292,4 378,52 378,224 298,156" fill="url(#violet)"/>
<polygon points="4,58 126,6 292,4 378,52 264,122 50,122" fill="url(#blue)"/>
<polygon points="4,58 126,6 292,4 378,52 264,122 50,122" fill="url(#adular)"/>

<!-- Canonical wireframe -->
<g fill="none" stroke="#111" stroke-width="1">
<polygon points="4,58 126,6 292,4 378,52 378,224 274,310 74,306 28,220"/>
<line x1="126" y1="6" x2="142" y2="156"/>
<line x1="292" y1="4" x2="298" y2="156"/>
<line x1="378" y1="52" x2="378" y2="224"/>
<line x1="50" y1="122" x2="264" y2="122"/>
<line x1="142" y1="156" x2="298" y2="156"/>
<line x1="28" y1="220" x2="142" y2="156"/>
<line x1="298" y1="156" x2="378" y2="224"/>
<line x1="74" y1="306" x2="274" y2="310"/>
<line x1="4" y1="58" x2="50" y2="122"/>
<line x1="264" y1="122" x2="378" y2="52"/>
</g>

</svg>
