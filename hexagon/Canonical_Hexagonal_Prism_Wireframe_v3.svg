<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="470" height="507" viewBox="0 0 470 507">
<style>
.visible{
  fill:none;
  stroke:#111;
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.hidden{
  fill:none;
  stroke:#111;
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:14 10;
}
</style>

<!-- Top hexagon -->
<polyline class="visible" points="72,112 155,52 315,52 398,112"/>
<polyline class="visible" points="72,112 155,178 315,178 398,112"/>

<!-- Slight perspective convergence -->
<line class="visible" x1="72"  y1="112" x2="78"  y2="420"/>
<line class="visible" x1="155" y1="178" x2="160" y2="452"/>
<line class="visible" x1="315" y1="178" x2="310" y2="452"/>
<line class="visible" x1="398" y1="112" x2="392" y2="420"/>

<!-- Bottom front -->
<polyline class="visible" points="78,420 160,452 310,452 392,420"/>

<!-- Hidden rear verticals -->
<line class="hidden" x1="195" y1="52" x2="195" y2="332"/>
<line class="hidden" x1="275" y1="52" x2="275" y2="332"/>

<!-- Hidden rear bottom -->
<line class="hidden" x1="195" y1="332" x2="275" y2="332"/>

<!-- Harmonized hidden diagonals -->
<line class="hidden" x1="160" y1="452" x2="195" y2="332"/>
<line class="hidden" x1="275" y1="332" x2="310" y2="452"/>

</svg>
