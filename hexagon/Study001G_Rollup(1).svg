<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
<style>
svg{background:var(--canvas,#fff);color:var(--wire,#000)}
.wire{stroke:currentColor;stroke-width:1.8;fill:none;vector-effect:non-scaling-stroke}
.facet{fill:#000;fill-opacity:.40;stroke:currentColor;stroke-width:1.8;vector-effect:non-scaling-stroke}
</style>

<defs>
  <polygon id="hexagon" points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17"/>
</defs>

<!-- Best-guess remembered neighbourhood: bases intentionally interpenetrate -->
<g id="remembered-neighbourhood">

  <!-- rear -->
  <g id="tower-b" transform="translate(500,445)">
    <polygon class="facet" points="-29,-17 0,-34 8,-176 -24,-156"/>
    <polygon class="facet" points="0,-34 29,-17 39,-150 8,-176"/>
    <polygon class="facet" points="29,-17 29,17 40,-112 39,-150"/>
    <polygon class="facet" points="29,17 0,34 10,-82 40,-112"/>
    <polygon class="facet" points="0,34 -29,17 -22,-95 10,-82"/>
    <polygon class="facet" points="-29,17 -29,-17 -24,-156 -22,-95"/>
    <use href="#hexagon" class="wire"/>
    <use href="#hexagon" class="wire" transform="translate(8,-134) rotate(-3) scale(1.08)"/>
  </g>

  <!-- left -->
  <g id="tower-a" transform="translate(456,492)">
    <polygon class="facet" points="-29,-17 0,-34 -8,-168 -38,-148"/>
    <polygon class="facet" points="0,-34 29,-17 22,-147 -8,-168"/>
    <polygon class="facet" points="29,-17 29,17 24,-112 22,-147"/>
    <polygon class="facet" points="29,17 0,34 -4,-82 24,-112"/>
    <polygon class="facet" points="0,34 -29,17 -35,-92 -4,-82"/>
    <polygon class="facet" points="-29,17 -29,-17 -38,-148 -35,-92"/>
    <use href="#hexagon" class="wire"/>
    <use href="#hexagon" class="wire" transform="translate(-8,-128) rotate(4) scale(1.07)"/>
  </g>

  <!-- right -->
  <g id="tower-c" transform="translate(544,492)">
    <polygon class="facet" points="-29,-17 0,-34 14,-165 -17,-145"/>
    <polygon class="facet" points="0,-34 29,-17 44,-140 14,-165"/>
    <polygon class="facet" points="29,-17 29,17 44,-105 44,-140"/>
    <polygon class="facet" points="29,17 0,34 13,-74 44,-105"/>
    <polygon class="facet" points="0,34 -29,17 -18,-86 13,-74"/>
    <polygon class="facet" points="-29,17 -29,-17 -17,-145 -18,-86"/>
    <use href="#hexagon" class="wire"/>
    <use href="#hexagon" class="wire" transform="translate(14,-131) rotate(5) scale(1.06)"/>
  </g>

  <!-- front -->
  <g id="tower-d" transform="translate(500,540)">
    <polygon class="facet" points="-29,-17 0,-34 -2,-150 -31,-131"/>
    <polygon class="facet" points="0,-34 29,-17 2,-126 -2,-150"/>
    <polygon class="facet" points="29,-17 29,17 2,-89 2,-126"/>
    <polygon class="facet" points="29,17 0,34 -1,-55 2,-89"/>
    <polygon class="facet" points="0,34 -29,17 -30,-73 -1,-55"/>
    <polygon class="facet" points="-29,17 -29,-17 -31,-131 -30,-73"/>
    <use href="#hexagon" class="wire"/>
    <use href="#hexagon" class="wire" transform="translate(-2,-116) rotate(2) scale(1.04)"/>
  </g>

</g>
</svg>
