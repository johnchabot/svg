<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
<style>
svg{background:#f7f7f7}
.face{stroke:#595959;stroke-width:1.3;stroke-linejoin:round}
.top{fill:url(#topShade)}
.front{fill:url(#frontShade)}
.right{fill:url(#rightShade)}
.internalGlow{opacity:.22}
.edgeBloom{opacity:.16}
.softWash{opacity:.10}
</style>
<defs>
<linearGradient id="topShade" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5f5f5"/><stop offset="100%" stop-color="#d8d8d8"/></linearGradient>
<linearGradient id="frontShade" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e6e6e6"/><stop offset="55%" stop-color="#cfcfcf"/><stop offset="100%" stop-color="#aaaaaa"/></linearGradient>
<linearGradient id="rightShade" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d2d2d2"/><stop offset="100%" stop-color="#979797"/></linearGradient>
<radialGradient id="glow" cx="45%" cy="42%" r="70%"><stop offset="0%" stop-color="#dff7ff" stop-opacity=".65"/><stop offset="35%" stop-color="#ffffff" stop-opacity=".22"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="wash" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white" stop-opacity=".20"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
</defs>
<polygon class="face top" points="120,60 220,60 270,95 220,130 120,130 70,95"/>
<polygon class="face front" points="120,130 220,130 220,245 120,245"/>
<polygon class="face right" points="220,130 270,95 270,210 220,245"/>
<polygon class="internalGlow" fill="url(#glow)" points="120,130 220,130 220,245 120,245"/>
<polygon class="softWash" fill="url(#wash)" points="120,130 220,130 220,245 120,245"/>
<line class="edgeBloom" x1="120" y1="130" x2="220" y2="130" stroke="white" stroke-width="2"/>
<line class="edgeBloom" x1="220" y1="130" x2="270" y2="95" stroke="white" stroke-width="1.5"/>
</svg>
