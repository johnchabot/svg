<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
<defs>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
<rect width="20" height="20" fill="#d8d8d8"/>
<rect width="10" height="10" fill="#efefef"/>
<rect x="10" y="10" width="10" height="10" fill="#efefef"/>
</pattern>
<filter id="soft"><feGaussianBlur stdDeviation="0.25"/></filter>
<radialGradient id="side" cx="50%" cy="42%" r="85%">
<stop offset="0%" stop-color="#314E73" stop-opacity=".48"/>
<stop offset="100%" stop-color="#00204D" stop-opacity=".42"/>
</radialGradient>
<radialGradient id="top" cx="50%" cy="42%" r="85%">
<stop offset="0%" stop-color="#5B7588" stop-opacity=".48"/>
<stop offset="100%" stop-color="#314E73" stop-opacity=".42"/>
</radialGradient>


<style type="text/css">
.facet{
  fill-opacity:0.22;
  stroke:#ffffff;
  stroke-opacity:0.42;
  stroke-width:1.15;
  vector-effect:non-scaling-stroke;
  filter:url(#glassSoft);
}
</style>

<filter id="glassSoft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="1.8" result="soft"/>
  <feMerge>
    <feMergeNode in="soft"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<linearGradient id="glassBlue" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#8fcfff" stop-opacity="0.30"/>
  <stop offset="55%" stop-color="#5b8fcb" stop-opacity="0.20"/>
  <stop offset="100%" stop-color="#2d5f9d" stop-opacity="0.14"/>
</linearGradient>

</defs>
<rect width="100%" height="100%" fill="url(#checker)"/>
