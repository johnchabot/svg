<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='420' viewBox='0 0 1200 420'>
<defs>
<pattern id='checker' width='20' height='20' patternUnits='userSpaceOnUse'><rect width='20' height='20' fill='#d8d8d8'/><rect width='10' height='10' fill='#efefef'/><rect x='10' y='10' width='10' height='10' fill='#efefef'/></pattern>
<filter id='bgBlur12'><feGaussianBlur stdDeviation='12'/></filter>
<filter id='disp'><feTurbulence type='fractalNoise' baseFrequency='0.03' numOctaves='2' seed='4' result='n'/><feDisplacementMap in='SourceGraphic' in2='n' scale='6'/></filter>
<clipPath id='hex'><polygon points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/></clipPath>
<style>text{font:16px Arial}.t{fill:#314E73;fill-opacity:.32}.e{fill:none;stroke:#314E73;stroke-opacity:.22;stroke-width:2}</style>
</defs>
<rect width='1200' height='420' fill='url(#checker)'/>
<text x='120' y='25'>A. Tint only</text><g transform='translate(0,20)'><polygon class='t' points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/><polygon class='e' points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/></g><text x='500' y='25'>B. Clipped blur</text><g transform='translate(380,20)'><g clip-path='url(#hex)'><rect width='460' height='360' fill='url(#checker)' filter='url(#bgBlur12)'/></g><polygon class='t' points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/><polygon class='e' points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/></g><text x='880' y='25'>C. Blur + displacement</text><g transform='translate(760,20)'><g clip-path='url(#hex)'><rect width='460' height='360' fill='url(#checker)' filter='url(#bgBlur12)'/><rect width='460' height='360' fill='url(#checker)' filter='url(#disp)' opacity='.25'/></g><polygon class='t' points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/><polygon class='e' points='170,40 290,40 360,100 360,250 290,320 170,320 100,250 100,100'/></g></svg>