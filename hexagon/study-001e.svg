<?xml version="1.0" encoding="UTF-8"?>
<!--
Study 001E

Relationships are authored.
Perception emerges.

The hexagon is the primitive.

(And yes... it's all about the hexagons.)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 600">

<style>
svg{
    background:#fafafa;
}

.edge{
    stroke:#171717;
    stroke-width:1.4;
    stroke-linejoin:round;
}

.top{
    fill:#555;
}

.left{
    fill:#333;
}

.right{
    fill:#111;
}
</style>

<defs>

    <!--
    Canonical primitive.

    Everything else is simply
    this hexagon, encountered.
    -->

    <polygon id="hex"
        points="
          0,-38
         34,-19
         34, 19
          0, 38
        -34, 19
        -34,-19"/>

</defs>

<g id="cluster">

    <!-- A -->

    <g transform="translate(300 248)">
        <use href="#hex" class="top edge"/>

        <polygon class="left edge"
            points="
            -34,19
             0,38
             0,242
            -40,270"/>

        <polygon class="right edge"
            points="
             0,38
            34,19
            40,270
             0,242"/>
    </g>

    <!-- B -->

    <g transform="translate(244 278)">
        <use href="#hex" class="top edge"/>

        <polygon class="left edge"
            points="
            -34,19
             0,38
             0,196
            -38,222"/>

        <polygon class="right edge"
            points="
             0,38
            34,19
            38,222
             0,196"/>
    </g>

    <!-- C -->

    <g transform="translate(356 274)">
        <use href="#hex" class="top edge"/>

        <polygon class="left edge"
            points="
            -34,19
             0,38
             0,206
            -38,234"/>

        <polygon class="right edge"
            points="
             0,38
            34,19
            38,234
             0,206"/>
    </g>

    <!-- D -->

    <g transform="translate(302 322)">
        <use href="#hex" class="top edge"/>

        <polygon class="left edge"
            points="
            -34,19
             0,38
             0,150
            -36,174"/>

        <polygon class="right edge"
            points="
             0,38
            34,19
            36,174
             0,150"/>
    </g>

</g>

</svg>