<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400">
<style>
:root{
  --canvas:#fff;
  --wire:#000;
  --facet-opacity:.18;
}
svg{background:var(--canvas);color:var(--wire)}
.base{fill:none;stroke:none}
.hex{fill:none;stroke:currentColor;stroke-width:2.2;vector-effect:non-scaling-stroke}
.facet{
  fill:#000;
  fill-opacity:var(--facet-opacity);
  stroke:currentColor;
  stroke-width:1.3;
  vector-effect:non-scaling-stroke;
}
</style>

<defs>
  <polygon id="hexagon"
    points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24"/>
</defs>

<!-- Study001J : geometry-first diagnostic -->
<g id="remembered-neighbourhood" transform="translate(800,1380) rotate(-12)">

  <!-- Bases intentionally overlap only slightly. -->
  <!-- Cap hexagons diverge independently. -->

  <g id="tower-back">
    <use href="#hexagon" class="base" transform="translate(0,-8)"/>
    <polygon class="facet" points="-42,-32 0,-56 8,-212 -30,-186"/>
    <polygon class="facet" points="0,-56 42,-32 48,-188 8,-212"/>
    <polygon class="facet" points="42,-32 42,16 48,-138 48,-188"/>
    <polygon class="facet" points="42,16 0,40 10,-96 48,-138"/>
    <polygon class="facet" points="0,40 -42,16 -30,-108 10,-96"/>
    <polygon class="facet" points="-42,16 -42,-32 -30,-186 -30,-108"/>
    <use href="#hexagon" class="hex" transform="translate(12,-156) rotate(-4) scale(1.04)"/>
  </g>

  <g id="tower-left" transform="translate(-34,22)">
    <use href="#hexagon" class="base"/>
    <polygon class="facet" points="-42,-24 0,-48 -12,-198 -44,-176"/>
    <polygon class="facet" points="0,-48 42,-24 20,-178 -12,-198"/>
    <polygon class="facet" points="42,-24 42,24 20,-132 20,-178"/>
    <polygon class="facet" points="42,24 0,48 -10,-88 20,-132"/>
    <polygon class="facet" points="0,48 -42,24 -44,-96 -10,-88"/>
    <polygon class="facet" points="-42,24 -42,-24 -44,-176 -44,-96"/>
    <use href="#hexagon" class="hex"/>
    <use href="#hexagon" class="hex" transform="translate(-18,-150) rotate(7) scale(1.05)"/>
  </g>

  <g id="tower-right" transform="translate(34,20)">
    <use href="#hexagon" class="base"/>
    <polygon class="facet" points="-42,-24 0,-48 18,-194 -14,-172"/>
    <polygon class="facet" points="0,-48 42,-24 54,-168 18,-194"/>
    <polygon class="facet" points="42,-24 42,24 54,-122 54,-168"/>
    <polygon class="facet" points="42,24 0,48 18,-84 54,-122"/>
    <polygon class="facet" points="0,48 -42,24 -14,-92 18,-84"/>
    <polygon class="facet" points="-42,24 -42,-24 -14,-172 -14,-92"/>
    <use href="#hexagon" class="hex"/>
    <use href="#hexagon" class="hex" transform="translate(22,-146) rotate(-6) scale(1.05)"/>
  </g>

  <g id="tower-front" transform="translate(0,44)">
    <use href="#hexagon" class="base"/>
    <polygon class="facet" points="-42,-24 0,-48 -2,-182 -34,-160"/>
    <polygon class="facet" points="0,-48 42,-24 30,-162 -2,-182"/>
    <polygon class="facet" points="42,-24 42,24 30,-118 30,-162"/>
    <polygon class="facet" points="42,24 0,48 -2,-78 30,-118"/>
    <polygon class="facet" points="0,48 -42,24 -34,-88 -2,-78"/>
    <polygon class="facet" points="-42,24 -42,-24 -34,-160 -34,-88"/>
    <use href="#hexagon" class="hex"/>
    <use href="#hexagon" class="hex" transform="translate(0,-138) rotate(3) scale(1.03)"/>
  </g>

</g>
</svg>
