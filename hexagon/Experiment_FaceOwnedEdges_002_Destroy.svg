<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="385" height="315" viewBox="0 0 385 315">

<defs>
<pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
<rect width="24" height="24" fill="#d8d8d8"/>
<rect width="12" height="12" fill="#efefef"/>
<rect x="12" y="12" width="12" height="12" fill="#efefef"/>
</pattern>
</defs>

<rect width="100%" height="100%" fill="url(#checker)"/>

<!-- Deliberately destructive test:
     Faces own boundaries.
     Some faces have missing or differently coloured edges.
-->

<!-- back face: no stroke on purpose -->
<polygon points="28,220 142,156 298,156 378,224 274,310 74,306"
 fill="#cfd8ff" fill-opacity="0.45"/>

<!-- left face: red boundary -->
<polygon points="4,58 50,122 74,306 28,220"
 fill="#ff80c0" fill-opacity="0.45"
 stroke="#ff0000" stroke-width="2"/>

<!-- lower face: cyan boundary -->
<polygon points="50,122 264,122 274,310 74,306"
 fill="#40dce8" fill-opacity="0.45"
 stroke="#00ffff" stroke-width="2"/>

<!-- right face: green boundary -->
<polygon points="264,122 378,52 378,224 274,310"
 fill="#ffb24b" fill-opacity="0.45"
 stroke="#00aa00" stroke-width="2"/>

<!-- upper faces -->
<polygon points="4,58 126,6 142,156 28,220"
 fill="#418dff" fill-opacity="0.45"
 stroke="#0066ff" stroke-width="2"/>

<polygon points="126,6 292,4 298,156 142,156"
 fill="#39dce8" fill-opacity="0.45"
 stroke="#00aaaa" stroke-width="2"/>

<polygon points="292,4 378,52 378,224 298,156"
 fill="#8667ff" fill-opacity="0.45"
 stroke="#6600ff" stroke-width="2"/>

<!-- top face intentionally missing stroke -->
<polygon points="4,58 126,6 292,4 378,52 264,122 50,122"
 fill="#418dff" fill-opacity="0.20"/>

</svg>
