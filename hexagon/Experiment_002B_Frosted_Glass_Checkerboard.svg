<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<defs>
<pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
<rect width="48" height="48" fill="#dadada"/>
<rect width="24" height="24" fill="#efefef"/>
<rect x="24" y="24" width="24" height="24" fill="#efefef"/>
</pattern>
<linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
<stop offset="45%" stop-color="#edf4fb" stop-opacity=".18"/>
<stop offset="100%" stop-color="#d8e4ef" stop-opacity=".10"/>
</linearGradient>
<linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#f7fbff" stop-opacity=".22"/>
<stop offset="100%" stop-color="#cddceb" stop-opacity=".08"/>
</linearGradient>
</defs>

<rect width="520" height="360" fill="url(#checker)"/>

<!-- rear prism -->
<g opacity=".18" stroke="#666" stroke-width="1">
<polygon fill="url(#facet)" points="170,90 270,90 320,125 270,160 170,160 120,125"/>
<polygon fill="url(#facet)" points="170,160 270,160 270,275 170,275"/>
<polygon fill="url(#side)" points="270,160 320,125 320,240 270,275"/>
<!-- left facet -->
<polygon fill="url(#side)" points="120,125 170,160 170,275 120,240"/>
</g>

<!-- front prism -->
<g stroke="#4f5660" stroke-width="1.2">
<polygon fill="url(#facet)" fill-opacity=".9" points="140,60 240,60 290,95 240,130 140,130 90,95"/>
<polygon fill="url(#facet)" fill-opacity=".9" points="140,130 240,130 240,245 140,245"/>
<polygon fill="url(#side)" fill-opacity=".9" points="240,130 290,95 290,210 240,245"/>
<!-- left facet -->
<polygon fill="url(#side)" fill-opacity=".9" points="90,95 140,130 140,245 90,210"/>

<line x1="140" y1="130" x2="240" y2="130" stroke="white" stroke-opacity=".25"/>
<line x1="240" y1="130" x2="290" y2="95" stroke="white" stroke-opacity=".25"/>
</g>
</svg>