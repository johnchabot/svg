<!-- tiny displacement -->
<filter id="facetFX" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="1" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"/>
  <feGaussianBlur stdDeviation="0.35"/>
</filter>

<linearGradient id="body0" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#183c78" stop-opacity=".54"/>
 <stop offset="60%" stop-color="#5c7891" stop-opacity=".46"/>
 <stop offset="100%" stop-color="#d4c866" stop-opacity=".40"/>
</linearGradient>

<linearGradient id="body1" x1="1" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#314E73" stop-opacity=".52"/>
 <stop offset="60%" stop-color="#8C9D9B" stop-opacity=".45"/>
 <stop offset="100%" stop-color="#EDD136" stop-opacity=".36"/>
</linearGradient>
</defs>

<rect width="100%" height="100%" fill="url(#checker)"/>
<polygon points="28,220 142,156 298,156 378,224 274,310 74,306" fill="url(#body0)" filter="url(#facetFX)"/>
