<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<defs>
<pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
  <rect width="48" height="48" fill="#d9d9d9"/>
  <rect width="24" height="24" fill="#efefef"/>
  <rect x="24" y="24" width="24" height="24" fill="#efefef"/>
</pattern>

<linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
  <stop offset="100%" stop-color="#eef4fa" stop-opacity=".10"/>
</linearGradient>
</defs>

<rect width="520" height="360" fill="url(#checker)"/>

<!-- Hidden rear geometry (wireframe only) -->
<g stroke="#80858c" stroke-opacity=".18" fill="none" stroke-width="1">
  <polygon points="160,85 260,85 310,120 260,155 160,155 110,120"/>
  <line x1="160" y1="155" x2="160" y2="270"/>
  <line x1="260" y1="155" x2="260" y2="270"/>
  <line x1="110" y1="120" x2="110" y2="235"/>
  <line x1="310" y1="120" x2="310" y2="235"/>
  <polyline points="110,235 160,270 260,270 310,235"/>
</g>

<!-- Accumulation planes -->
<g stroke="none">
  <!-- left -->
  <polygon fill="url(#glass)" fill-opacity=".18"
    points="90,95 140,130 140,245 90,210"/>
  <!-- front -->
  <polygon fill="url(#glass)" fill-opacity=".18"
    points="140,130 240,130 240,245 140,245"/>
  <!-- right -->
  <polygon fill="url(#glass)" fill-opacity=".18"
    points="240,130 290,95 290,210 240,245"/>

  <!-- rear/front overlap hint -->
  <polygon fill="url(#glass)" fill-opacity=".12"
    points="110,120 160,155 160,270 110,235"/>

  <polygon fill="url(#glass)" fill-opacity=".12"
    points="160,155 260,155 260,270 160,270"/>

  <polygon fill="url(#glass)" fill-opacity=".12"
    points="260,155 310,120 310,235 260,270"/>

  <!-- bottom accumulation -->
  <polygon fill="#dce6f2" fill-opacity=".16"
    points="140,245 240,245 260,270 160,270"/>
</g>

<!-- Front wireframe -->
<g stroke="#4f5660" stroke-width="1.2" fill="none">
  <polygon points="140,60 240,60 290,95 240,130 140,130 90,95"/>
  <polygon points="90,95 140,130 140,245 90,210"/>
  <polygon points="140,130 240,130 240,245 140,245"/>
  <polygon points="240,130 290,95 290,210 240,245"/>
  <line x1="140" y1="130" x2="240" y2="130" stroke="white" stroke-opacity=".25"/>
</g>
</svg>
