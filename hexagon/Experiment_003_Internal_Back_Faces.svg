<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
<defs>
<pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
<rect width="48" height="48" fill="#d8d8d8"/>
<rect width="24" height="24" fill="#eeeeee"/>
<rect x="24" y="24" width="24" height="24" fill="#eeeeee"/>
</pattern>

<linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
<stop offset="45%" stop-color="#edf4fb" stop-opacity=".18"/>
<stop offset="100%" stop-color="#d7e3ef" stop-opacity=".08"/>
</linearGradient>
</defs>

<rect width="520" height="360" fill="url(#checker)"/>

<!-- Back faces of SAME prism -->
<g opacity=".16" stroke="#6f7780" stroke-width="1">
  <polygon fill="url(#glass)" points="165,100 265,100 315,135 265,170 165,170 115,135"/>
  <polygon fill="url(#glass)" points="165,170 265,170 265,285 165,285"/>
  <polygon fill="url(#glass)" points="265,170 315,135 315,250 265,285"/>
  <polygon fill="url(#glass)" points="115,135 165,170 165,285 115,250"/>
</g>

<!-- Front faces -->
<g stroke="#505760" stroke-width="1.2">
  <polygon fill="url(#glass)" points="140,60 240,60 290,95 240,130 140,130 90,95"/>
  <polygon fill="url(#glass)" points="140,130 240,130 240,245 140,245"/>
  <polygon fill="url(#glass)" points="240,130 290,95 290,210 240,245"/>
  <polygon fill="url(#glass)" points="90,95 140,130 140,245 90,210"/>

  <!-- front edges -->
  <line x1="140" y1="130" x2="240" y2="130" stroke="white" stroke-opacity=".28"/>
  <line x1="240" y1="130" x2="290" y2="95" stroke="white" stroke-opacity=".28"/>
  <line x1="140" y1="130" x2="90" y2="95" stroke="white" stroke-opacity=".16"/>
</g>
</svg>
