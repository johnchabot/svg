<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="385" height="315" viewBox="0 0 385 315">
<defs>
<pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
<rect width="24" height="24" fill="#d8d8d8" /><rect width="12" height="12" fill="#efefef" /><rect x="12" y="12" width="12" height="12" fill="#efefef" />
