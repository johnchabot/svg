<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="385" height="315" viewBox="0 0 385 315">
<defs>
<pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
<rect width="24" height="24" fill="#d8d8d8"/>
<rect width="12" height="12" fill="#efefef"/>
<rect x="12" y="12" width="12" height="12" fill="#efefef"/>
</pattern>
</defs>

<rect width="100%" height="100%" fill="url(#checker)"/>

<!--
Experiment 006
Faces own explicit edge PATHS instead of using polygon strokes.

Some shared edges are intentionally omitted from one neighbouring face,
forcing a single "owner" for that edge.
-->

<!-- Back -->
<g id="bottom">
<polygon points="28,220 142,156 298,156 378,224 274,310 74,306"
         fill="#dfe5ff" fill-opacity="0.45"/>
<!-- owns only bottom edge -->
<path d="M74 306 L274 310" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="left">
<polygon points="4,58 50,122 74,306 28,220"
         fill="#ffb7d5" fill-opacity="0.45"/>
<!-- owns left silhouette -->
<path d="M4 58 L50 122 L74 306" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="lower">
<polygon points="50,122 264,122 274,310 74,306"
         fill="#aef6ff" fill-opacity="0.45"/>
<!-- owns top horizontal only -->
<path d="M50 122 L264 122" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="right">
<polygon points="264,122 378,52 378,224 274,310"
         fill="#ffe2a4" fill-opacity="0.45"/>
<!-- owns right silhouette -->
<path d="M378 52 L378 224 L274 310" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="front">
<polygon points="4,58 126,6 142,156 28,220"
         fill="#bddbff" fill-opacity="0.45"/>
<!-- owns top and front-left -->
<path d="M4 58 L126 6 L142 156" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="middle">
<polygon points="126,6 292,4 298,156 142,156"
         fill="#c8ffff" fill-opacity="0.45"/>
<!-- owns top only -->
<path d="M126 6 L292 4" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="rear">
<polygon points="292,4 378,52 378,224 298,156"
         fill="#ddd1ff" fill-opacity="0.45"/>
<!-- owns top diagonal -->
<path d="M292 4 L378 52" stroke="#111" stroke-width="2" fill="none"/>
</g>

<g id="top">
<polygon points="4,58 126,6 292,4 378,52 264,122 50,122"
         fill="#d0e4ff" fill-opacity="0.20"/>
<!-- owns front top edge only -->
<path d="M50 122 L4 58 L126 6 L292 4 L378 52 L264 122"
      stroke="#111" stroke-width="2" fill="none"/>
</g>

</svg>
