<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="385" height="315" viewBox="0 0 385 315">
<defs>
<pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
<rect width="24" height="24" fill="#d8d8d8"/>
<rect width="12" height="12" fill="#efefef"/>
<rect x="12" y="12" width="12" height="12" fill="#efefef"/>
</pattern>

<filter id="tinyRefract" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"
                     xChannelSelector="R" yChannelSelector="G"/>
</filter>

<filter id="soft"><feGaussianBlur stdDeviation="0.25"/></filter>

<radialGradient id="side" cx="50%" cy="42%" r="85%">
<stop offset="0%" stop-color="#314E73" stop-opacity=".48"/>
<stop offset="100%" stop-color="#00204D" stop-opacity=".42"/>
</radialGradient>

<radialGradient id="top" cx="50%" cy="42%" r="85%">
<stop offset="0%" stop-color="#5B7588" stop-opacity=".48"/>
<stop offset="100%" stop-color="#314E73" stop-opacity=".42"/>
</radialGradient>
</defs>

<rect width="100%" height="100%" fill="url(#checker)"/>

<g filter="url(#tinyRefract)">
